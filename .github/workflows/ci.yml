name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution à la fois par branche : une nouvelle poussée annule l'ancienne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Garder en phase avec la clé `volta.node` de package.json.
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn version comes from package.json)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint and format check
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

  e2e:
    name: E2E (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn version comes from package.json)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run end-to-end tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: yarn test:e2e

      - name: Run end-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum yarn test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
