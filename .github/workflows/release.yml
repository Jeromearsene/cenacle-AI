name: Release

# On every push to main:
# - while changesets are waiting, a "Version packages" pull request is opened or updated
#   (it bumps the version and writes CHANGELOG.md);
# - when that pull request is merged, the release is tagged and the installers are built
#   and attached to the GitHub release.
# - run by hand (Actions > Release > Run workflow) with the tag of an existing release, it
#   builds the installers of that release again and attaches them: for a release whose
#   installers are missing or failed to upload.
# - once the installers are attached, a pull request points the Homebrew cask (Casks/cenacle.rb)
#   at the new release: merging it is what makes `brew upgrade` offer the new version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release to build the installers for (for example v0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version or tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn version comes from package.json)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Open the "Version packages" PR, or tag the release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn changeset version
          publish-script: yarn changeset tag
          pr-title: "Version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the tag to build
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.os }})
    needs: version
    # `version` is skipped on a manual run; without `!cancelled()` that would skip this job too.
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.version.outputs.published == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag }}
      - name: Enable Corepack (Yarn version comes from package.json)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # No certificate is looked for on Windows and Linux (the app is not code-signed there). On
      # macOS the app is signed ad hoc (electron-builder.yml) and built as "Cenacle.app": with the
      # accent of "Cénacle.app" the packaged app crashes at launch on macOS 26 (SIGTRAP in the
      # browser process). The name the app shows at run time (productName in package.json) and
      # the installers' file names are not affected.
      - name: Build the installers
        run: yarn dist --publish never ${{ matrix.os == 'macos-latest' && '-c.productName=Cenacle' || '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}
      # Not `yarn dist --publish always`: electron-builder refuses to add files to a release
      # published more than 2 hours ago, which is exactly the case of a manual run.
      - name: Attach the installers to the release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" \
            release/*.{dmg,zip,exe,AppImage,deb,blockmap} release/latest*.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}

  homebrew:
    name: Homebrew cask
    needs: [version, build]
    # Only when every installer is attached: `build` is skipped or failed otherwise.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A manual run can rebuild the installers of an old release: the cask must not go back to it.
      - name: Check that this is the latest release
        id: latest
        shell: bash
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the latest release ($latest): the cask is left alone."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}
      - name: Point the cask at the release
        id: cask
        if: steps.latest.outputs.latest == 'true'
        shell: bash
        run: |
          node scripts/homebrew/update-cask.mjs --tag "$TAG"
          if git diff --quiet -- Casks/cenacle.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}
      - name: Open the pull request
        if: steps.cask.outputs.changed == 'true'
        shell: bash
        run: |
          version="${TAG#v}"
          branch="chore/homebrew-cask-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks/cenacle.rb
          git commit -m "chore: update the Homebrew cask to $version"
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: update the Homebrew cask to $version" \
              --body "Points \`Casks/cenacle.rb\` at release $TAG: new version and SHA-256 of the two macOS disk images, read from the release. Merge it so that \`brew upgrade --cask cenacle\` offers $version."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}
