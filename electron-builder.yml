# Installers (yarn pack / yarn dist). Documentation: https://www.electron.build/configuration
appId: io.github.jeromearsene.cenacle
productName: Cénacle
copyright: Copyright © 2026 Jeromearsene
artifactName: Cenacle-${version}-${os}-${arch}.${ext}

directories:
  output: release

# The app is the Vite build in out/ and the icons in resources/.
files:
  - out/**
  - resources/**
  - package.json

publish:
  provider: github
  owner: Jeromearsene
  repo: cenacle-AI
  # Only describes where updates come from (and writes latest*.yml): the installers are uploaded
  # by the release workflow, which runs `yarn dist --publish never`.

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }

win:
  icon: resources/icon.ico
  target:
    - { target: nsis, arch: [x64] }

linux:
  icon: resources/icon.png
  category: Network
  # Required by the .deb; the GitHub no-reply address keeps the personal email out of the repo.
  maintainer: Jeromearsene <9333686+Jeromearsene@users.noreply.github.com>
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }
