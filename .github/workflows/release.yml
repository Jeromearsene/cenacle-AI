name: Release

# On every push to main:
# - while changesets are waiting, a "Version packages" pull request is opened or updated
#   (it bumps the version and writes CHANGELOG.md);
# - when that pull request is merged, the release is tagged and the installers are built
#   and attached to the GitHub release.
# - run by hand (Actions > Release > Run workflow) with the tag of an existing release, it
#   builds the installers of that release again and attaches them: for a release whose
#   installers are missing or failed to upload.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release to build the installers for (for example v0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version or tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn version comes from package.json)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Open the "Version packages" PR, or tag the release
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset version
          publish: yarn changeset tag
          title: "Version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the tag to build
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.os }})
    needs: version
    # `version` is skipped on a manual run; without `!cancelled()` that would skip this job too.
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.version.outputs.published == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag }}
      - name: Enable Corepack (Yarn version comes from package.json)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The app is not code-signed yet: no certificate is looked for.
      # `releaseType=release` is also set on the command line: the code of an old tag does not
      # have it in electron-builder.yml, and without it the installers are not attached to a
      # release that is already published.
      - name: Build and publish the installers
        run: yarn dist --publish always -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
