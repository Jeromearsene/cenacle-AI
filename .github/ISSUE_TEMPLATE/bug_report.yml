name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The version of the installer or release you use, or "from source" with the commit.
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Service concerned
      options: [Claude, ChatGPT, Gemini, Other, Not related to a service]
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or logs help. Do not paste cookies, tokens or conversation content.
